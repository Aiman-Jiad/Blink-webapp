<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./blink.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b141a" />
    <meta name="description" content="Blink — a premium real-time messenger. Fast, secure, beautifully designed." />
    <title>Blink — Real-time Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Inline critical CSS — shown immediately before the JS bundle loads.
         Prevents the blank/white flash on cold load. */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        background-color: #0b141a;
        color: #f5f5f5;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html:not(.dark) body { background-color: #f6f8f6; color: #1a2e24; }

      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: inherit;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }

      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4ade80, #0d9488);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
        position: relative;
      }
      .splash-logo svg { width: 35px; height: 35px; color: white; }
      .splash-logo .dot {
        position: absolute;
        bottom: -3px;
        right: -3px;
        width: 14px;
        height: 14px;
        background: #4ade80;
        border-radius: 50%;
        border: 2px solid #0b141a;
      }
      html:not(.dark) .splash-logo .dot { border-color: #f6f8f6; }

      .splash-wordmark {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: inherit;
      }

      .splash-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(74, 222, 128, 0.25);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Inline splash: visible immediately, hidden once React renders -->
    <div id="splash" aria-hidden="true">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="dot"></span>
      </div>
      <span class="splash-wordmark">Blink</span>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide splash once React has mounted -->
    <script>
      (function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.firstElementChild) {
            var splash = document.getElementById('splash');
            if (splash) {
              splash.classList.add('hide');
              setTimeout(function() { splash.remove(); }, 350);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root') || document.body, {
          childList: true, subtree: false
        });
        // Fallback: remove after 8 seconds regardless
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) s.remove();
        }, 8000);
      })();
    </script>
  </body>
</html>
